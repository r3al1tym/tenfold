  for (let j = 0; j < 6; j++) polar(x, am, bm, a => 4.6 + 2.4 * Math.sin(6 * a + j * TAU / 6), 1, 0.9, 400);
}

// ---------- paper ----------
// Cotton security paper: cloudy formation, a felted surface that shows in raking light, a gentle
// cockle from the intaglio press, and a scatter of red and blue security fibres in the pulp.
let PAPER = null;
function buildPaper() {
  const form = noiseField('formation', 70, 4, 0.55), grain = noiseField('grain', 2.4, 2, 0.6), cockle = noiseField('cockle', 320, 2, 0.4);
  const fib = layer(), r = rng('felt'); fib.lineCap = 'round';
  for (let i = 0; i < 16000; i++) { const x = r() * W, y = r() * H, a = r() * TAU, l = 4 + r() * 13, b = (r() - 0.5) * 0.8;
    fib.globalAlpha = 0.25 + r() * 0.4; fib.lineWidth = 0.6 + r() * 0.7; fib.beginPath(); fib.moveTo(x, y);
    fib.quadraticCurveTo(x + Math.cos(a + b) * l / 2, y + Math.sin(a + b) * l / 2, x + Math.cos(a) * l, y + Math.sin(a) * l); fib.stroke(); }
  const felt = gauss(alphaOf(fib), 0.6);
  const sec = layer(), rs = rng('security-fibres'); sec.lineCap = 'round';
  for (let i = 0; i < 46; i++) { let x = rs() * W, y = rs() * H, a = rs() * TAU; const n = 9 + (rs() * 12 | 0), col = rs() < 0.55 ? '178,52,62' : '58,84,170';
    sec.lineWidth = 0.55 + rs() * 0.35;
    for (let k = 0; k < n; k++) { const nx = x + Math.cos(a) * 3.4, ny = y + Math.sin(a) * 3.4; a += (rs() - 0.5) * 0.7;
      sec.strokeStyle = `rgba(${col},${(0.25 + 0.75 * Math.abs(Math.sin(k * 0.45 + i))).toFixed(3)})`; sec.beginPath(); sec.moveTo(x, y); sec.lineTo(nx, ny); sec.stroke(); x = nx; y = ny; } }
  const sd = sec.getImageData(0, 0, W, H).data;
  const h = new Float32Array(N), alb = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const px = i % W, py = (i / W) | 0;
    // the note is not flat: one broad, soft curl across the sheet from the wallet it lived in
    h[i] = 0.05 * grain[i] + 0.07 * felt[i] + 5 * cockle[i] + 6 * Math.sin(Math.PI * (px * 0.62 + py * 0.78) / 1300 + 0.5);
    const f = 1 + 0.018 * form[i], sa = sd[i * 4 + 3] / 255 * 0.75;
    alb[i * 3] = (238 * f) * (1 - sa) + sd[i * 4] * sa; alb[i * 3 + 1] = (234 * f) * (1 - sa) + sd[i * 4 + 1] * sa; alb[i * 3 + 2] = (220 * f) * (1 - sa) + sd[i * 4 + 2] * sa;
  }
  PAPER = { h, alb, edge: noiseField('ink-edge', 1.4, 2, 0.5), voids: noiseField('ink-voids', 4, 2, 0.5), woodA: noiseField('wood-figure', 110, 2, 0.5), woodB: noiseField('wood-pores', 3, 1) };
}

// ---------- one lamp ----------
// A single low lamp at the upper left. Intaglio ink stands proud of the sheet, so each line gets
// a lit shoulder, a short cast shadow and a direction-dependent sheen; the press embosses the
// paper around heavy work; the letterpress serial sits in a shallow dent with ink squeezed to its rim.
const INK = [21, 45, 37], SIM = [92, 134, 138], LAMP = [1.0, 0.975, 0.93];
const IRIS = [[0, 98, 86, 184], [0.4, 132, 80, 176], [0.64, 182, 88, 150], [0.9, 206, 140, 66], [1, 206, 140, 66]];
function iris(u) { for (let k = 1; k < IRIS.length; k++) if (u <= IRIS[k][0]) { const a = IRIS[k - 1], b = IRIS[k], f = (u - a[0]) / (b[0] - a[0]); return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, a[3] + (b[3] - a[3]) * f]; } return IRIS[IRIS.length - 1].slice(1); }
function compose(t) {
  const I = buildIntaglio(t), icM = alphaOf(I.x), icT = alphaOf(I.ty);
  const O = buildOffset(t), off = alphaOf(O.x), offC = alphaOf(O.xc), offS = alphaOf(O.xs), ic = new Float32Array(N), embSrc = new Float32Array(N);
  for (let i = 0; i < N; i++) { ic[i] = Math.min(1, icM[i] + icT[i]); embSrc[i] = icM[i] + 0.6 * icT[i]; }
  const inkH = gauss(ic, 0.8), hM = gauss(icM, 0.8), hT = gauss(icT, 0.8), emb = blur(embSrc, 20), P = PAPER;
  // hp is the sheet's own surface; h adds the ink standing on it. Type stands a little lower than
  // the plate work. Paper is shaded from hp only, so ink never lights a rim. Until the lamp drops
  // the ink lies nearly flat; then it stands up to its full height and the paper takes the press's
  // emboss round the heavy work.
  const up = lift(t), kh = 0.15 + 0.85 * up;
  const h = new Float32Array(N), hp = new Float32Array(N);
  for (let i = 0; i < N; i++) { hp[i] = P.h[i] + 0.8 * kh * emb[i]; h[i] = hp[i] + kh * (1.5 * hM[i] + 0.9 * hT[i]); }
  // one lamp at the upper left: it starts high, drops to 14 degrees as the build lands, then breathes
  const az = (225 + 9 * Math.sin((t - HERO) * 0.9)) * Math.PI / 180, el = (14 + 36 * (1 - up)) * Math.PI / 180;
  const Lx = Math.cos(el) * Math.cos(az), Ly = Math.cos(el) * Math.sin(az), Lz = Math.sin(el), tanEl = Math.tan(el);
  const hl = Math.hypot(Lx, Ly, Lz + 1), Hx = Lx / hl, Hy = Ly / hl, Hz = (Lz + 1) / hl;
  const sdx = Math.cos(az), sdy = Math.sin(az), flatSpec = Math.pow(Hz, 14);
  const img = out.createImageData(W, H), d = img.data, mi = M_INT;   // rotation part inverts by transpose: u = a du + b dv, v = c du + d dv
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    // albedo: paper, then offset (transparent) and intaglio (opaque)
    let r = P.alb[i * 3], g2 = P.alb[i * 3 + 1], b = P.alb[i * 3 + 2];
    // transparent inks multiply where they overprint; the corona runs the fountain 30% greyer
    const oc = off[i] * 0.88, ocr = offC[i] * 0.88, os = offS[i] * 0.86;
    if (oc > 0 || ocr > 0) { const c = iris(clamp(y / H * 0.82 + x / W * 0.18)), l = 0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2];
      if (oc > 0) { r *= 1 - oc * (1 - c[0] / 255); g2 *= 1 - oc * (1 - c[1] / 255); b *= 1 - oc * (1 - c[2] / 255); }
      if (ocr > 0) { r *= 1 - ocr * (1 - (l + 0.7 * (c[0] - l)) / 255); g2 *= 1 - ocr * (1 - (l + 0.7 * (c[1] - l)) / 255); b *= 1 - ocr * (1 - (l + 0.7 * (c[2] - l)) / 255); } }
    if (os > 0) { r *= 1 - os * (1 - SIM[0] / 255); g2 *= 1 - os * (1 - SIM[1] / 255); b *= 1 - os * (1 - SIM[2] / 255); }
    const ih = inkH[i] + 0.11 * P.edge[i], cov = smooth(0.2, 0.6, ih), io = cov * (0.62 + 0.38 * smooth(0.45, 0.92, inkH[i])) * (1 - 0.18 * smooth(0.55, 0.85, P.voids[i]) * smooth(0.8, 1, inkH[i]));
    if (io > 0) { r += (INK[0] - r) * io; g2 += (INK[1] - g2) * io; b += (INK[2] - b) * io; }
    // relief
    const wi = clamp(io * 1.6), hx = ((h[i + 1] - h[i - 1]) * wi + (hp[i + 1] - hp[i - 1]) * (1 - wi)) / 2, hy = ((h[i + W] - h[i - W]) * wi + (hp[i + W] - hp[i - W]) * (1 - wi)) / 2, nz = 1 / Math.sqrt(hx * hx + hy * hy + 1), nx = -hx * nz, ny = -hy * nz;
    const ndl = nx * Lx + ny * Ly + nz * Lz; let shade = 0.42 + 0.58 * Math.max(0, ndl) / Lz;
    let occ = 0; for (let s = 1; s <= 7; s++) { const u = Math.round(x + sdx * s), v = Math.round(y + sdy * s); if (u < 0 || v < 0 || u >= W || v >= H) break; occ = Math.max(occ, h[v * W + u] - h[i] - s * tanEl); }
    shade *= 1 - 0.3 * smooth(0, 0.4, occ);
    const fall = 1.08 - 0.17 * Math.pow(x / W * 0.5 + y / H * 0.5, 1.3);
    const spec = 0.34 * io * Math.max(0, Math.pow(Math.max(0, nx * Hx + ny * Hy + nz * Hz), 14) - flatSpec);
    const o = i * 4;
    d[o] = r * shade * fall * LAMP[0] + 255 * spec * LAMP[0]; d[o + 1] = g2 * shade * fall * LAMP[1] + 255 * spec * LAMP[1]; d[o + 2] = b * shade * fall * LAMP[2] + 255 * spec * LAMP[2]; d[o + 3] = 255;
    // the sheet's cut edge and the table under it: walnut, its figure running with the grain,
    // with the note's soft shadow thrown away from the lamp along the right and bottom edges
    const du = x - mi[4], dv = y - mi[5], u = mi[0] * du + mi[1] * dv, v = mi[2] * du + mi[3] * dv;
    const din = Math.min(EDGE[0] - u, EDGE[1] - v), cover = clamp(din + 0.5 + 0.45 * P.edge[i]);
    if (din < 3) { const k = 0.8 + 0.2 * smooth(0, 2.4, din); d[o] *= k; d[o + 1] *= k; d[o + 2] *= k; }
    if (cover < 1) {
      const eo = Math.hypot(Math.max(0, u - EDGE[0]), Math.max(0, v - EDGE[1])), ac = -x * 0.14 + y * 0.99;
      const grain = 0.8 + 0.1 * Math.sin(ac * 0.42 + 3.2 * P.woodA[i]) + 0.05 * Math.sin(ac * 1.9 + 1.4 * P.woodA[i] + 1) - 0.07 * smooth(0.5, 0.9, P.woodB[i]);
      const tf = grain * fall * (1 - 0.6 * (1 - smooth(1, 30, eo)));
      d[o] = d[o] * cover + 76 * tf * (1 - cover); d[o + 1] = d[o + 1] * cover + 52 * tf * (1 - cover); d[o + 2] = d[o + 2] * cover + 37 * tf * (1 - cover);
    }
  }
  for (let x = 0; x < W; x++) for (const y of [0, H - 1]) { const o = (y * W + x) * 4, q = ((y ? H - 2 : 1) * W + x) * 4; d[o] = d[q]; d[o + 1] = d[q + 1]; d[o + 2] = d[q + 2]; d[o + 3] = 255; }
  for (let y = 0; y < H; y++) for (const x of [0, W - 1]) { const o = (y * W + x) * 4, q = (y * W + (x ? W - 2 : 1)) * 4; d[o] = d[q]; d[o + 1] = d[q + 1]; d[o + 2] = d[q + 2]; d[o + 3] = 255; }
  out.putImageData(img, 0, 0);
}

buildPaper();
window.__riso = { duration: DURATION, hero: HERO, ready: true, build: { end: BUILD_END }, seek(t) { compose(clamp(t, 0, DURATION)); } };
// draw the hero for a person opening the file; the render harness seeks for itself
if (!navigator.webdriver) setTimeout(() => window.__riso.seek(HERO), 0);
</script>
