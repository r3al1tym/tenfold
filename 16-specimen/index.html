<script>
"use strict";
const PHRASE_TO_RENDER = 'a little faith in impossible things';
// A glazed entomology drawer seen from above. Six moths are pinned in white card unit trays in an
// oak frame, and each carries one word of the phrase as a marking in its scales.
const W = 1080, H = 1350, DUR = 6, HERO = 5.3; // the hero is the finished drawer, BUILD_END + 0.6
const cv = document.getElementById('c'), X = cv.getContext('2d');

// ---------- seeded randomness ----------
function hash(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngFor(key) {
  let a = hash(key);
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function noiseFor(key) {
  const r = rngFor(key), P = new Uint16Array(512), G = new Float32Array(512);
  for (let i = 0; i < 256; i++) { P[i] = i; const a = r() * Math.PI * 2; G[2 * i] = Math.cos(a); G[2 * i + 1] = Math.sin(a); }
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0, t = P[i]; P[i] = P[j]; P[j] = t; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  const g = (h, x, y) => G[2 * h] * x + G[2 * h + 1] * y;
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, Xi = xi & 255, Yi = yi & 255;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = P[P[Xi] + Yi], b = P[P[Xi + 1] + Yi], c = P[P[Xi] + Yi + 1], d = P[P[Xi + 1] + Yi + 1];
    const x1 = g(a, xf, yf) + (g(b, xf - 1, yf) - g(a, xf, yf)) * u;
    const x2 = g(c, xf, yf - 1) + (g(d, xf - 1, yf - 1) - g(c, xf, yf - 1)) * u;
    return (x1 + (x2 - x1) * v) * 1.4;
  };
}
const _nz = {}; const nzc = k => _nz[k] || (_nz[k] = noiseFor(k));
function fbm(n, x, y, oct = 4) { let s = 0, a = 0.5, f = 1, t = 0; for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f); t += a; a *= 0.5; f *= 2.03; } return s / t; }
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const shade = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const rgba = (c, a = 1) => `rgba(${clamp(c[0], 0, 255) | 0},${clamp(c[1], 0, 255) | 0},${clamp(c[2], 0, 255) | 0},${a})`;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const ease = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };

// ---------- palette: a decision, four families ----------
// OAK: the drawer's quartersawn frame. LABEL: cream card and the typewriter's brown-black ribbon.
// MOTH: umber, cinnamon and ochre, the scales of five species. BLUE: one species whose colour is
// structural, so it shifts scale by scale and wing by wing with the light.
const PAL = {
  oakDark: hex('#3a2617'), oak: hex('#6b4628'), oakLight: hex('#9a6c40'),
  floor: hex('#e2d8c2'), cork: hex('#a07a52'), card: hex('#efe6d0'), ink: hex('#2c231d'), iron: hex('#4a3322'),
  umber: hex('#4b3020'), cinnamon: hex('#94592f'), ochre: hex('#c18d45'), buff: hex('#dcc196'),
  blue: hex('#2a56c2'), blueDeep: hex('#14246e'), blueHi: hex('#4f8ee0'),
};

// ---------- light: one raking window, upper left ----------
// Shadows fall down-right. A thing at height h (px) throws its shadow h*K away. The tray walls stand
// close to the floor and throw sharp shadows; a specimen rides three centimetres up its pin and
// throws a wide, soft one.
const SH = { x: 0.56, y: 0.83 }, K = 1.1, SOFT = 0.03;
const MM = 3.6; // px per millimetre across the whole drawer
const HEIGHT = { moth: 32 * MM, trayWall: 12 * MM, drawerWall: 22 * MM }; // a specimen rides high on its pin, clear of the walls

// ---------- wing geometry ----------
// A wing is a closed Catmull-Rom outline in right-wing local px (origin: thorax centre, head up).
// The left wing is the same outline mirrored, re-set a degree or two off: no setter is exact.
function spline(pts, seg = 20) {
  const out = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let k = 0; k < seg; k++) {
      const t = k / seg, t2 = t * t, t3 = t2 * t, f = j => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3);
      out.push([f(0), f(1)]);
    }
  }
  return out;
}
const NB = 1440;
function makeWing(pts, base, hs, side, rot, scl = 1) {
  const poly = spline(pts.map(p => [p[0] * hs * scl, p[1] * hs * scl])), b = [base[0] * hs * scl, base[1] * hs * scl];
  const R = new Float32Array(NB);
  for (let i = 0; i < NB; i++) {
    const a = -Math.PI + (i + 0.5) / NB * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
    let best = 0;
    for (let k = 0; k < poly.length; k++) {
      const p = poly[k], q = poly[(k + 1) % poly.length], ex = q[0] - p[0], ey = q[1] - p[1];
      const den = dx * ey - dy * ex; if (Math.abs(den) < 1e-9) continue;
      const wx = p[0] - b[0], wy = p[1] - b[1], t = (wx * ey - wy * ex) / den, u = (wx * dy - wy * dx) / den;
      if (t > 0 && u >= 0 && u <= 1 && t > best) best = t;
    }
    R[i] = best;
  }
  let maxR = 0; for (const v of R) maxR = Math.max(maxR, v);
  let amin = 9, amax = -9;
  for (const p of poly) { const dx = p[0] - b[0], dy = p[1] - b[1]; if (Math.hypot(dx, dy) < 0.35 * maxR) continue; const a = Math.atan2(dy, dx); amin = Math.min(amin, a); amax = Math.max(amax, a); }
  const c = Math.cos(rot), s = Math.sin(rot), q = [b[0] * side, b[1]];
  const w = { poly, base: b, R, maxR, amin, amax, side, hs,
    // local (right-wing) -> moth px
    fwd: (x, y) => { const vx = (x - b[0]) * side, vy = y - b[1]; return [q[0] + vx * c - vy * s, q[1] + vx * s + vy * c]; },
    inv: (x, y) => { const vx = x - q[0], vy = y - q[1]; return [b[0] + (vx * c + vy * s) * side, b[1] + (-vx * s + vy * c)]; },
    setT: (ctx, ox, oy) => { ctx.setTransform(c * side, s * side, -s, c, ox + q[0] - (c * side * b[0] - s * b[1]), oy + q[1] - (s * side * b[0] + c * b[1])); },
  };
  w.polar = (x, y) => {
    const dx = x - b[0], dy = y - b[1], d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
    const i = clamp(Math.floor((a + Math.PI) / (Math.PI * 2) * NB), 0, NB - 1), Rr = R[i] || 1e-6;
    return { d, a, r: d / Rr, fn: (a - amin) / (amax - amin), Rr };
  };
  return w;
}
// Veins radiate from the base: each runs from a trunk angle (near the base) to its end angle
// at the margin, so the cell and the branching read without drawing a diagram.
function veinDist(w, P, veins) {
  let best = 1e9;
  for (const v of veins) {
    const t = smooth(v[2] ?? 0.12, v[3] ?? 0.55, P.r), fv = lerp(v[0], v[1], t);
    if (P.r < (v[4] ?? 0)) continue;
    const da = Math.abs(P.fn - fv) * (w.amax - w.amin) * P.d; if (da < best) best = da;
  }
  return best;
}

// ---------- wing pattern helpers ----------
// Lines run as iso-lines of r (base-to-margin fraction), so they follow each wing's own shape the
// way antemedial and postmedial lines do on a real wing.
const AA = 0.9;
function lineCov(P, r0, wpx) { const d = Math.abs(P.r - r0) * P.Rr, h = Math.max(wpx, 1.1) / 2; return 1 - smooth(h - AA, h + AA, d); }
function ringCov(d, r0, r1) { return smooth(r0 - AA, r0 + AA, d) * (1 - smooth(r1 - AA, r1 + AA, d)); }
function dSeg(x, y, ax, ay, bx, by) { const vx = bx - ax, vy = by - ay, t = clamp(((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy)); return Math.hypot(x - ax - vx * t, y - ay - vy * t); }
function veinMod(w, P, veins, c, k, wpx) { const d = veinDist(w, P, veins), h = Math.max(wpx, 1) / 2; return mix(c, shade(c, k), 1 - smooth(h - 0.6, h + 0.8, d)); }

// The letters: an "o" is an eyespot whose counter is a clear, scaleless window; the "b" is
// drawn by the thorax fur. Both are slightly oval and share one baseline.
const LET = { oRx: 30, oRy: 33, stroke: 16, cy: 24 };
function ovalD(x, y, cx, cy, rx, ry) { const nx = (x - cx) / rx, ny = (y - cy) / ry, k = Math.hypot(nx, ny); return k * (rx + ry) / 2; }

const SPECIES = {};
SPECIES.obo = {
  key: 'obo', hs: 430, name: 'Onebyonia singulatim',
  fw: { base: [0.05, -0.05], pts: [[0.05, -0.095], [0.24, -0.17], [0.52, -0.232], [0.8, -0.27], [0.955, -0.268], [0.99, -0.236], [0.95, -0.15], [0.885, -0.02], [0.79, 0.12], [0.665, 0.235], [0.52, 0.235], [0.32, 0.175], [0.13, 0.095], [0.05, 0.03]] },
  hw: { base: [0.04, 0.03], pts: [[0.05, -0.01], [0.3, 0.04], [0.55, 0.11], [0.69, 0.2], [0.735, 0.31], [0.7, 0.45], [0.585, 0.585], [0.43, 0.68], [0.27, 0.715], [0.14, 0.665], [0.065, 0.52], [0.045, 0.3]] },
  body: { thW: 0.1, thL: 0.152, abL: 0.62, abW: 0.066, fur: [PAL.cinnamon, PAL.ochre], abFur: [PAL.cinnamon, PAL.buff] },
  ant: { kind: 'feather', len: 0.36, ang: 0.5, comb: 0.05 },
  eye: [186, 24],
  fwVeins: [[0.05, 0.02], [0.1, 0.1], [0.16, 0.2], [0.2, 0.32], [0.28, 0.45], [0.36, 0.58], [0.45, 0.7], [0.56, 0.8], [0.7, 0.9]],
  hwVeins: [[0.1, 0.08], [0.2, 0.2], [0.3, 0.34], [0.38, 0.48], [0.46, 0.62], [0.55, 0.76], [0.66, 0.88]],
  paint(wn, w, x, y, P, nz) {
    const fw = wn === 'fw', hs = this.hs, wig = nz(P.fn * 3.1 + (fw ? 0 : 9), 1.3 + w.side) * 0.018;
    const mott = fbm(nz, x / hs * 9, y / hs * 9, 3), cloud = fbm(nz, x / hs * 3.2 + 11, y / hs * 3.2, 3);
    const am = 0.3 + 0.028 * Math.sin(P.fn * 6.5) + wig + 0.012 * nz(P.fn * 14, 3);
    const pm = (fw ? 0.68 : 0.6) + 0.022 * Math.sin(P.fn * 9 + (fw ? 0 : 2)) + wig + 0.01 * nz(P.fn * 17, 5);
    // zones, base to margin: umber hair at the base, a cinnamon basal field, an ochre median
    // clouded with cinnamon, the pale postmedial line, a rosy-umber submarginal band, buff margin
    let c = mix(shade(PAL.umber, 1.1), PAL.cinnamon, smooth(0.04, 0.22, P.r));
    c = mix(c, mix(PAL.ochre, PAL.cinnamon, 0.25), smooth(fw ? am - 0.03 : 0.22, fw ? am + 0.01 : 0.36, P.r));
    c = mix(c, PAL.cinnamon, clamp(cloud * 1.6 + 0.15) * smooth(0.3, 0.4, P.r) * (1 - smooth(pm - 0.08, pm, P.r)) * 0.55);
    c = mix(c, mix(hex('#8a5a40'), PAL.ochre, 0.35), smooth(pm + 0.02, pm + 0.06, P.r));
    c = mix(c, mix(hex('#7a5038'), PAL.cinnamon, 0.3), smooth(0.86, 0.96, P.r) * 0.6);
    c = shade(c, 1 + mott * 0.09 + (fw ? 0.03 - 0.06 * P.fn : -0.03 * P.r));
    if (fw) {
      c = mix(c, PAL.buff, lineCov(P, am - 0.02, 0.011 * hs) * 0.8);
      c = mix(c, PAL.umber, lineCov(P, am, 0.01 * hs) * 0.9);
      // apical mark: a soft dark wedge under a pale zigzag, as on Antheraea
      const ad = dSeg(x, y, 0.79 * hs, -0.2 * hs, 0.94 * hs, -0.245 * hs);
      c = mix(c, PAL.umber, (1 - smooth(0.006 * hs, 0.03 * hs, ad)) * 0.4);
      c = mix(c, hex('#e8d6b4'), (1 - smooth(0.004 * hs, 0.016 * hs, Math.abs(ad - 0.034 * hs))) * 0.4);
    }
    c = mix(c, PAL.umber, lineCov(P, pm, 0.011 * hs) * 0.85);
    c = mix(c, hex('#ead9b6'), lineCov(P, pm + 0.024, 0.013 * hs) * 0.85);
    c = mix(c, shade(PAL.umber, 1.05), lineCov(P, (fw ? 0.875 : 0.85) + 0.02 * Math.sin(P.fn * 26) + wig, 0.007 * hs) * 0.6);
    c = veinMod(w, P, fw ? this.fwVeins : this.hwVeins, c, 0.82, 0.006 * hs);
    if (!fw) { // a small discal spot on the hindwing, no window
      const dd = Math.hypot(x - 0.36 * hs, y - 0.33 * hs);
      c = mix(c, PAL.umber, (1 - smooth(0.022 * hs, 0.03 * hs, dd)) * 0.55);
    }
    let win = 0;
    if (fw && this.eye) {
      const d = ovalD(x, y, this.eye[0], this.eye[1], LET.oRx, LET.oRy), s = LET.stroke;
      const rIn = (LET.oRx + LET.oRy) / 2 - s;
      win = 1 - smooth(rIn - 1.2, rIn + 0.6, d);
      c = mix(c, PAL.umber, ringCov(d, rIn, rIn + s));
      // the eyespot's outer rings stay quiet so the dark ring reads as one letter, not a target
      c = mix(c, mix(PAL.ochre, hex('#dcae58'), 0.5), ringCov(d, rIn + s, rIn + s + 7.5));
      c = mix(c, mix(PAL.cinnamon, PAL.umber, 0.3), ringCov(d, rIn + s + 7.5, rIn + s + 9.5) * 0.7);
    }
    return { c, win };
  },
};

const V9 = [[0.04, 0.02], [0.1, 0.12], [0.16, 0.24], [0.22, 0.36], [0.3, 0.5], [0.4, 0.63], [0.5, 0.75], [0.62, 0.86], [0.74, 0.95]];
const V7 = [[0.1, 0.06], [0.2, 0.2], [0.3, 0.36], [0.4, 0.52], [0.5, 0.66], [0.6, 0.8], [0.7, 0.92]];
// c p: a hawkmoth, built to push. Narrow pointed forewings with the oblique apical streak.
SPECIES.cp = {
  key: 'cp', hs: 84, name: 'Commitia propulsa',
  fw: { base: [0.06, -0.06], pts: [[0.06, -0.11], [0.4, -0.21], [0.74, -0.29], [0.985, -0.34], [0.975, -0.3], [0.8, -0.13], [0.62, 0.0], [0.48, 0.085], [0.3, 0.085], [0.13, 0.045], [0.06, 0.0]] },
  hw: { base: [0.05, 0.02], pts: [[0.06, -0.01], [0.3, 0.03], [0.5, 0.08], [0.57, 0.15], [0.5, 0.25], [0.35, 0.32], [0.2, 0.33], [0.08, 0.25], [0.05, 0.12]] },
  body: { thW: 0.115, thL: 0.15, abL: 0.74, abW: 0.1, fur: [hex('#6e6050'), hex('#8a7a66')], abFur: [hex('#6e6050'), PAL.ochre], bands: 1 },
  ant: { kind: 'thread', len: 0.36, ang: 0.42, club: 1 },
  paint(wn, w, x, y, P, nz) {
    const hs = this.hs, mott = fbm(nz, x / hs * 7, y / hs * 7, 3);
    let c;
    if (wn === 'fw') {
      c = shade(mix(hex('#857564'), PAL.buff, 0.18 + 0.2 * smooth(0.5, 1, P.r)), 1 + mott * 0.1);
      const sd = dSeg(x, y, 0.95 * hs, -0.33 * hs, 0.32 * hs, 0.06 * hs);
      c = mix(c, PAL.umber, (1 - smooth(0.018 * hs, 0.03 * hs, sd)) * 0.8);
      c = mix(c, PAL.buff, (1 - smooth(0.006 * hs, 0.012 * hs, Math.abs(sd - 0.04 * hs))) * 0.7);
      c = mix(c, PAL.umber, (1 - smooth(0.012 * hs, 0.02 * hs, Math.hypot(x - 0.38 * hs, y + 0.12 * hs))) * 0.9);
      c = veinMod(w, P, V9, c, 0.86, 1);
    } else {
      c = mix(PAL.ochre, hex('#d3a24c'), 0.4 + mott * 0.3);
      c = mix(c, PAL.umber, smooth(0.62, 0.7, P.r) * 0.92);
      c = mix(c, PAL.umber, (1 - smooth(0.2, 0.32, P.r)) * 0.7);
    }
    return { c, win: 0 };
  },
};
// oic: the one structural colour in the drawer. Its blue is not pigment, so the paint is a
// field of indices; the scale pass turns them into blue by each scale's angle to the light.
SPECIES.oic = {
  key: 'oic', hs: 86, name: 'Chromia aperta', blue: true,
  fw: { base: [0.05, -0.05], pts: [[0.05, -0.1], [0.4, -0.2], [0.75, -0.26], [0.95, -0.27], [0.97, -0.2], [0.9, -0.05], [0.78, 0.13], [0.62, 0.2], [0.4, 0.15], [0.16, 0.07], [0.05, 0.02]] },
  hw: { base: [0.05, 0.02], pts: [[0.05, -0.01], [0.35, 0.05], [0.62, 0.14], [0.7, 0.26], [0.66, 0.4], [0.6, 0.5], [0.56, 0.72], [0.5, 0.74], [0.47, 0.56], [0.36, 0.58], [0.2, 0.52], [0.08, 0.38], [0.05, 0.2]] },
  body: { thW: 0.09, thL: 0.13, abL: 0.56, abW: 0.07, fur: [hex('#2a2a3a'), hex('#3a3550')], abFur: [hex('#2a2a3a'), PAL.ochre], bands: 1 },
  ant: { kind: 'thread', len: 0.42, ang: 0.36 },
  paint(wn, w, x, y, P, nz) {
    const hs = this.hs, mott = fbm(nz, x / hs * 6, y / hs * 6, 2);
    let c = shade(hex('#2c2620'), 1 + mott * 0.08), blue = 0;
    if (wn === 'fw') {
      for (const b of [0.3, 0.55, 0.8]) blue = Math.max(blue, lineCov(P, b + 0.02 * Math.sin(P.fn * 5 + b * 9), 0.075 * hs));
      { const q = w.fwd(x, y); blue *= 1 - 0.85 * bandNear(this, q[0] + this.wOx, q[1] + this.wOy); } // the stripes go quiet behind the word
    } else {
      blue = smooth(0.08, 0.2, P.r) * (1 - smooth(0.72, 0.8, P.r));
      if (P.r > 0.85 && P.fn > 0.25 && P.fn < 0.55) c = mix(c, PAL.buff, 0.85);
    }
    c = veinMod(w, P, wn === 'fw' ? V9 : V7, c, 0.8, 1);
    return { c, win: 0, blue };
  },
};
// cmu: a geometrid, the oldest specimen in the drawer: faded, a piece of hindwing lost.
SPECIES.cmu = {
  key: 'cmu', hs: 84, name: 'Catchmeupia octo', old: true,
  fw: { base: [0.05, -0.05], pts: [[0.05, -0.085], [0.4, -0.145], [0.76, -0.205], [0.94, -0.225], [0.905, -0.08], [0.81, 0.1], [0.7, 0.205], [0.42, 0.145], [0.16, 0.065], [0.06, 0.02]] },
  hw: { base: [0.05, 0.03], pts: [[0.06, 0.0], [0.36, 0.08], [0.66, 0.17], [0.76, 0.29], [0.745, 0.4], [0.61, 0.53], [0.41, 0.6], [0.21, 0.56], [0.08, 0.41], [0.05, 0.2]] },
  body: { thW: 0.075, thL: 0.12, abL: 0.52, abW: 0.055, fur: [hex('#a48a66'), PAL.buff], abFur: [hex('#a48a66'), PAL.buff] },
  ant: { kind: 'thread', len: 0.38, ang: 0.44 },
  paint(wn, w, x, y, P, nz) {
    const hs = this.hs, mott = fbm(nz, x / hs * 6, y / hs * 6, 3), fw = wn === 'fw';
    let c = shade(mix(hex('#e3d2b0'), PAL.buff, 0.4 + mott * 0.4), 1 + mott * 0.05);
    const off = fw ? 0 : -0.05;
