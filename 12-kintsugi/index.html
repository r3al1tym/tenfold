<script>
"use strict";

// ---------- light: one window light low on the upper left, raking ----------
const ELEV = 63 * Math.PI / 180, TANE = Math.tan(ELEV);   // high enough that the rim's shade ends above the first line
const L2 = [-0.5, -0.866];                       // horizontal direction toward the light
const LV = [L2[0] * Math.cos(ELEV), L2[1] * Math.cos(ELEV), Math.sin(ELEV)];

// ---------- the bowl: a hand-pinched chawan whose well sits off centre ----------
const CX = 540, CY = 868, R0 = 470, SC = R0 / 470, LIPW = 62, DEPTH = 250, LIP = 26, HB = 380;
const FC = [CX + 12, CY + 2], RF = 0.6 * R0;   // a broad flat well, so the phrase lies level
const rimN = noiseFor('rim'), floorN = noiseFor('floor'), lipN = noiseFor('lip');
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
const pinchAt = th => Math.exp(-((angDiff(th, 2.5) / .34) ** 2));
function rimOuter(th) {

  const pinch = -.05 * pinchAt(th) - .032 * Math.exp(-((angDiff(th, -.5) / .42) ** 2));

// distance from the bowl's centre, along angle th, to the edge of the floor of the well
function floorEdge(th) {
  const dx = Math.cos(th), dy = Math.sin(th), fx = FC[0] - CX, fy = FC[1] - CY;
  const rf = RF * (1 + .07 * floorN(dx * 1.4 + 3, dy * 1.4 + 7) + .035 * Math.sin(3 * th + 1));

// The lip is no tube: some runs were cut flat, others keep the potter's round, the pinch rises
// and narrows, and a few spatula cuts leave planar facets on the inner shoulder.
const FACETS = [[200, 16], [-38, 13], [72, 11], [128, 9], [-150, 10]], HERA = [[172, 24], [236, 18], [18, 16], [98, 22], [-72, 15], [-118, 12]];

    if (m > 0 && u < .2) { const chord = mix(-13, -.6, (u + .85) / 1.05); z = mix(z, Math.max(z - 3, Math.min(z, chord)), m); }

    const m = sstep(w / 2 + 2, w / 2 - 2, Math.abs(angDiff(th, a * DEG)) / DEG);
    if (m > 0 && u > .25) z = mix(z, Math.max(z - 4.5, Math.min(z, mix(-1.2, -LIP * .8, (u - .25) / .75))), m);
  }

}
// height of the glaze surface, 0 at the top of the lip, before facets and texture
function zProfile(x, y, r, th, ro, ri) {
  if (r >= ri) return lipZ(2 * (r - ri) / (ro - ri) - 1, th);
  const rf = floorEdge(th);
  if (r > rf) { const u = (ri - r) / (ri - rf); return -LIP - (DEPTH - LIP) * (1 - Math.pow(1 - u, 2.2)); }
  const q = r / rf, d = 1 - q * q, w = Math.hypot(x - FC[0] - 10, y - FC[1] - 6) / 74, well = w < 1 ? (1 - w * w) ** 2 : 0;
  return -DEPTH - 16 * d * d - 9 * well;
}
// the rim shades the inner wall: a crescent of shade on the side toward the window
function innerVis(x, y, z) {
  const rise = Math.max(0, -6 - z) / TANE, qx = x + L2[0] * rise - CX, qy = y + L2[1] * rise - CY;
  const th = Math.atan2(qy, qx), pen = 2 + rise * .07;
  return sstep(-pen, pen, rimInner(th) + 4 - Math.hypot(qx, qy));
}
// the bowl's shadow on the cloth: its outline stacked by height, foot ring up to rim
function outerFrac(h) { return h < .07 ? .44 : h < .2 ? mix(.44, .9, sstep(.07, .2, h)) : mix(.9, 1, sstep(.2, 1, h)); }

  let v = 1;

    const h = k / 20, ht = h * HB, o = ht / TANE, ox = x - (CX - L2[0] * o), oy = y - (CY - L2[1] * o);
    const d = Math.hypot(ox, oy) - rimOuter(Math.atan2(oy, ox)) * outerFrac(h), pen = 1.5 + ht * .045;

}
// ---------- paths ----------

// E = signed distance to the gold edge (negative inside), WD = local half-width, SID = seam,

  const id = SEAMS.length;

  { const g = SHQ.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W / 4 + 80, H / 4 + 360); g.drawImage(SH, 40, 320, W / 4, H / 4); }
  WHOLE = layer(d => { for (let k = 0; k < N; k++) if (BA[k] > 0) { for (let i = 0; i < 3; i++) d[k * 4 + i] = toS(BOWL[k * 3 + i]); d[k * 4 + 3] = Math.round(255 * BA[k]); } });

}
// the bowl arrives from the far edge of the cloth and is lowered: high, it is larger and its
// shadow falls further off and softer, arriving first; at rest the shadow tucks in under the foot.
// It comes from the far edge so that it never crosses the film's edge strip at the near one.
const LIFT = 1460;   // far enough that the leading shadow starts out of frame
function setDown(u) {
  const h = (1 - u) * 170, hn = h / 170, lift = -(1 - u) * LIFT, s = 1 + h / 1500, so = h / TANE;
  const place = (ox, oy) => cx.setTransform(s, 0, 0, s, CX - s * CX + ox, CY - s * CY + oy - FY);
  cx.drawImage(G8, 0, 0);

  cx.imageSmoothingEnabled = false; cx.globalAlpha = 1 - hn; cx.drawImage(SH, 0, 0); cx.imageSmoothingEnabled = true;
  const g = TQ.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W / 4 + 80, H / 4 + 360); g.filter = `blur(${(.3 + h * .016).toFixed(2)}px)`; g.drawImage(SHQ, 0, 0); g.filter = 'none';
  cx.globalAlpha = hn * (1 - .4 * hn); cx.drawImage(TQ, 0, 0, W / 4 + 80, H / 4 + 360, -160, -1280, W + 320, H + 1440);
  cx.globalCompositeOperation = 'source-over'; cx.globalAlpha = 1;

}
// apart: the cloth shows dark through the gaps; each shard turns its broken clay edge to us
function apart(t) {
  cx.drawImage(G8, 0, 0);
  cx.globalCompositeOperation = 'multiply'; cx.drawImage(SH, 0, 0); cx.globalCompositeOperation = 'source-over';
  let mx = 0; for (const o of SHARDS) mx = Math.max(mx, sepOf(o, t)[0]);
  cx.globalAlpha = mx; cx.drawImage(FOOT, 0, 0); cx.globalAlpha = 1;
  for (const o of SHARDS) {
    const [e, hl] = sepOf(o, t), rest = t < o.back ? o.pre : o.home;   // before it leaves, the bare break; once home, the lacquered seam
    if (e < .002 && hl < .002) { cx.drawImage(rest, o.x0, o.y0); continue; }
    // lifted, it is a little larger, tipped, and casts a soft shadow down and to the right
    const S = 1 + o.lift * hl, fs = 1 - .02 * hl, so = 34 * hl, place = (ox, oy) => {
      cx.setTransform(1, 0, 0, 1, o.cx + o.dx * e + ox, o.cy + o.dy * e + oy - FY); cx.rotate(o.rot * e + o.axis); cx.scale(S, S * fs); cx.rotate(-o.axis); cx.translate(-o.cx, -o.cy); };
    place(-L2[0] * so, -L2[1] * so); cx.globalAlpha = .62 * sstep(0, .3, hl); cx.drawImage(o.sh, o.x0 - 20, o.y0 - 20, o.sh.width * 4, o.sh.height * 4);
    place(0, 0);
    const kA = sstep(0, .25, e); cx.globalAlpha = 1 - kA; cx.drawImage(rest, o.x0, o.y0); cx.globalAlpha = kA; cx.drawImage(o.apart, o.x0, o.y0);

  }
}
// at rest: the crack runs along each line, then gold follows it seam by seam, glossy as it lands
// and drying to satin, the last seam still wet
function pixels(t) {
  const d = OUT.data; d.set(REST8);
  const S = SPX, n = S.k.length;
  const run = (k, a, b) => { const s = SEAMS[SID[k]]; return clamp(((t - a) / Math.max(1e-3, b - a) - SP[k]) * s.L / 5 + 1, 0, 1); };
  const fillAt = k => run(k, SEAMS[SID[k]].t0, SEAMS[SID[k]].t1);
  const px = (k, r, g, b) => { d[k * 4] = toS(r); d[k * 4 + 1] = toS(g); d[k * 4 + 2] = toS(b); };
  for (let m = 0; m < n; m++) {
    const k = S.k[m], s = SEAMS[SID[k]], cr = run(k, s.c0, s.c1); if (cr <= 0) continue;
    const fl = run(k, s.t0, s.t1), tp = s.t0 + SP[k] * (s.t1 - s.t0);
    const wt = fl <= 0 ? 0 : s.wet ? 1 : Math.exp(-Math.max(0, t - tp) / .5);
    let r = BASE[k * 3], g = BASE[k * 3 + 1], b = BASE[k * 3 + 2];
    const q = k - 1 - 2 * W;
    if (S.CG[q] > 0) { const sh = .25 * S.CG[q] * fillAt(q) * (1 - S.cg[m]); r *= 1 - sh; g *= 1 - sh; b *= 1 - sh; }
    const cc = S.cc[m] * cr * (1 - fl), j = m * 3;
    if (cc > 0) { if (t < T_LOCK) { r = mix(r, S.cl[j], cc); g = mix(g, S.cl[j + 1], cc); b = mix(b, S.cl[j + 2], cc); } else { r = mix(r, .004, cc); g = mix(g, .0035, cc); b = mix(b, .003, cc); } }
    const cu = S.cu[m] * fl, cg = S.cg[m] * fl;
    r = mix(mix(r, mix(S.ud[j], S.uw[j], wt), cu), mix(S.gd[j], S.gw[j], wt), cg);
    g = mix(mix(g, mix(S.ud[j + 1], S.uw[j + 1], wt), cu), mix(S.gd[j + 1], S.gw[j + 1], wt), cg);
    b = mix(mix(b, mix(S.ud[j + 2], S.uw[j + 2], wt), cu), mix(S.gd[j + 2], S.gw[j + 2], wt), cg);
    px(k, r, g, b);

}
// the brush slides down its own axis until its point rests on the wet seam; its shadow travels with it
function brush(t) {
  const off = 660 * (1 - ease((t - 4.0) / .6)), sx = BD[0] - L2[0] * BK / TANE, sy = BD[1] - L2[1] * BK / TANE;
  cx.globalCompositeOperation = 'multiply'; cx.drawImage(BRSH, off * sx, off * sy);
  cx.globalCompositeOperation = 'source-over'; cx.drawImage(BRS, off * BD[0], off * BD[1]);
}
function seek(t) {

}
// the bake runs after the page has loaded, so a busy machine slows the first frame and never
// trips the loader's timeout
window.__riso = { duration: DUR, ready: false, seek, hero: HERO, build: { end: BUILD_END } };
addEventListener('load', () => setTimeout(() => { bake(); seek(HERO); window.__riso.ready = true; }, 0));
</script>
