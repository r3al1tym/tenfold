<script>

// ---------- the room (metres; x right, y up, z away from the seat) ----------
// materials: 0 wall plaster, 1 polished concrete floor, 2 limestone stair, 3 ceiling, 4 steel, 5 rail, 6 court stone
const BL = [], ML = [], GROUPS = [];
function box(x0, y0, z0, x1, y1, z1, m) { BL.push(x0, y0, z0, x1, y1, z1); ML.push(m); }
function group(fn) { const i0 = ML.length; fn(); GROUPS.push([i0, ML.length]); }
// A top-lit stair hall: a glass roof (out of frame) and a wall return (the pier) on the right. A high
// sun from straight behind the camera comes through the roof. The solid roof strip over the entrance
// throws its shadow edge onto the foot of the first riser, so the floor in front of the stair sits
// in shade and the stair itself in sun; the roof is glass over the pier, so its front face is lit.
const SUN_E = 68 * D2R, SUN_A = 0 * D2R;           // sun elevation; azimuth from straight behind toward the right
const DOOR = { x0: -0.9, x1: 0.48, y0: 2.8, y1: 5.0 };          // doorway at the top of the stair, onto a deep court
const ZB = 13.5, ZD = 40.0, XL = -2.0, XR = 3.2, YC = 16.0;     // back wall, the court's far wall, wall faces, roof
const RISE = 0.175, GOING = 0.30, Z0 = 6.0, NSTEP = 16;
const PIER = { x0: 1.15, z0: 3.2, z1: 4.2, h: 4.8 };            // the return: x0..XR, z0..z1; its top is out of frame
const RT = 0.4, ZRF = Z0 - 0.015 - (YC + RT) * Math.cos(SUN_A) / Math.tan(SUN_E);   // roof glass starts here: shade edge at the stair foot
group(() => {                                                    // shell
  box(XL, -0.3, -4.3, XR, 0, 16.5, 1);                          // floor
  box(XL, 0, -4.3, XR, YC, -4.0, 0);                            // wall behind the seat
  box(XL - 0.3, 0, -4.3, XL, YC, 16.5, 0);                      // left wall
  box(XR, -0.3, -4.3, XR + 0.3, YC, 16.5, 0);                   // right wall
  box(XL, YC, -4.3, PIER.x0 + 0.09, YC + RT, ZRF, 3);           // solid roof over the entrance (glass over the pier;
                                                                 // the 9 cm overlap keeps the penumbra off the floor)
});
group(() => {                                                    // back wall, doorway, and the open court beyond
  box(XL, 0, ZB, DOOR.x0, YC, ZB + 0.4, 0);
  box(DOOR.x1, 0, ZB, XR, YC, ZB + 0.4, 0);
  box(DOOR.x0, DOOR.y1, ZB, DOOR.x1, YC, ZB + 0.4, 0);
  box(-5.0, 0, ZB, 3.0, DOOR.y0, ZD, 2);                         // the court floor (the landing runs on)
  box(-5.0, DOOR.y0, ZD, 3.0, 16.0, ZD + 0.3, 6);                // its far wall, warm stone, open to the sky and in full sun

group(() => {                                                    // the stair: square limestone blocks, no nosing
  for (let k = 1; k <= NSTEP; k++) box(XL, 0, Z0 + GOING * (k - 1), XR, RISE * k, Z0 + GOING * k, 2);

group(() => { box(PIER.x0, 0, PIER.z0, XR, PIER.h, PIER.z1, 0); });   // the pier: a wall return
// the handrail: a painted steel bar on the left wall, pitched with the stair (an oriented box)
const NBOX = ML.length, RTH = Math.atan2(RISE, GOING);
const RE2 = [0, Math.cos(RTH), -Math.sin(RTH)], RE3 = [0, Math.sin(RTH), Math.cos(RTH)];
const RZ0 = Z0 - 0.25, RZ1 = Z0 + GOING * (NSTEP - 1) + 0.25, RZM = (RZ0 + RZ1) / 2;

const NRM = [], TBS = [];                         // per-face normal and tangent basis

  const rx = ox - RC[0], ry = oy - RC[1], rz = oz - RC[2];

let RF = 0;
const BX = new Float64Array(BL), NG = GROUPS.length;
