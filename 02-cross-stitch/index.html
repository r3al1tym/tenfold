<!doctype html>
<html><head><meta charset="utf-8"><title>02 cross-stitch sampler: a little faith in impossible things</title>
<style>html,body{margin:0;background:#1d1a17}canvas{display:block;width:720px;height:900px;margin:0 auto}</style>
</head><body><canvas id="c" width="1080" height="1350"></canvas>
<script>
'use strict';
// Counted cross-stitch on 14-count oatmeal Aida, stranded cotton, one window light.
// Every pixel is computed: the weave per pixel, every strand of every leg as a lit tube.
// The phrase film: the hoop starts as empty Aida, and the motto stitches itself in, leg by leg.
const PHRASE_TO_RENDER = 'a little faith in impossible things';
const W = 1080, H = 1350, P = 12;               // P = one Aida block in px
const DURATION = 6, BUILD_END = 4.6, HERO = 5.2;

// ---------- seeded randomness (pure in its key) ----------
function hash32(str) {
  let h = 2166136261 >>> 0;

  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; return h >>> 0;

function rng(key) {
  let a = hash32(key);
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function ih(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;

function vn(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = ih(xi, yi, s), b = ih(xi + 1, yi, s), c = ih(xi, yi + 1, s), d = ih(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, o) { let v = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { v += a * vn(x * f, y * f, s + i * 17); f *= 2.03; a *= 0.5; } return v; }
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lin = c => Math.pow(c / 255, 2.2);
const rgb = (r, g, b) => [lin(r), lin(g), lin(b)];

// ---------- light: one window, upper left ----------
const L = (() => { const v = [-0.62, -0.56, 0.45], n = Math.hypot(...v); return v.map(x => x / n); })();
const HV = (() => { const v = [L[0], L[1], L[2] + 1], n = Math.hypot(...v); return v.map(x => x / n); })();
const SHX = -L[0] / L[2], SHY = -L[1] / L[2];  // shadow offset per px of lift
const LIGHT = [1.04, 1.0, 0.92], AMB = [0.86, 0.92, 1.02];

// ---------- palette (stranded cotton) ----------
const FLOSS = {
  madder: rgb(198, 8, 22), turkey: rgb(222, 3, 34), indigo: rgb(20, 30, 88), sage: rgb(126, 142, 100), ochre: rgb(200, 146, 50),
};
const OAT = rgb(224, 213, 192);

// ---------- the cloth sits a little off-square in the hoop, and is not perfectly flat ----------
const ROT = 0.0058, CR = Math.cos(ROT), SR = Math.sin(ROT);
const U0 = W / P / 2, V0 = H / P / 2;
function warp(u, v) { return [(fbm(u * 0.03, v * 0.03, 11, 3) - 0.5) * 6, (fbm(u * 0.03, v * 0.03, 29, 3) - 0.5) * 6]; }
// The camera looks down at the hoop tipped a few degrees: the far (top) edge sits a little smaller.
const KEY = 0.05;
function fwd(u, v) {
  const x0 = (u - U0) * P, y0 = (v - V0) * P, w = warp(u, v);
  const X = x0 * CR - y0 * SR + w[0], Y = x0 * SR + y0 * CR + w[1], z = 1 - KEY * Y / H;
  return [W / 2 + X / z, H / 2 + Y / z];
}
function inv(x, y) {
  const yp = y - H / 2, Y0 = yp / (1 + KEY * yp / H), X0 = (x - W / 2) * (1 - KEY * Y0 / H);
  let u = 0, v = 0, wx = 0, wy = 0;
  for (let k = 0; k < 4; k++) {
    const dx = X0 - wx, dy = Y0 - wy;
    u = (dx * CR + dy * SR) / P + U0; v = (-dx * SR + dy * CR) / P + V0;
    const w = warp(u, v); wx = w[0]; wy = w[1];
  }
  return [u, v];
}

// ---------- the alphabet ----------
// A bold sampler lowercase: x-height 7 blocks, 2-block stems, ascenders and descenders of 3 blocks.
// l, i, f and t stand on 1-block foot serifs. Rows top to bottom; top = row offset from the x-height top.
// Three-quarter stitches round the corners and bracket the serifs later; crossbars stay square.
const NR = (n, r = '##..##') => Array(n).fill(r);
const BIG = {
  a: { top: 0, rows: ['.####.', '....##', '.#####', ...NR(3), '.#####'] },
  b: { top: -3, rows: [...NR(3, '##....'), '#####.', ...NR(5), '#####.'] },
  e: { top: 0, rows: ['.####.', ...NR(2), '######', ...NR(2, '##....'), '.#####'] },
  f: { top: -3, rows: ['..###', ...NR(2, '.##..'), '####.', ...NR(5, '.##..'), '####.'] },
  g: { top: 0, rows: ['.#####', ...NR(5), '.#####', '....##', '##..##', '.####.'] },
  h: { top: -3, rows: [...NR(3, '##....'), '#####.', ...NR(6)] },
  i: { top: -3, rows: ['.##.', '.##.', '....', ...NR(6, '.##.'), '####'] },
  l: { top: -3, rows: [...NR(9, '.##.'), '####'] },
  m: { top: 0, rows: ['####.####.', ...NR(6, '##..##..##')] },
  n: { top: 0, rows: ['#####.', ...NR(6)] },
  o: { top: 0, rows: ['.####.', ...NR(5), '.####.'] },
  p: { top: 0, rows: ['#####.', ...NR(5), '#####.', ...NR(3, '##....')] },
  s: { top: 0, rows: ['.####.', '##..##', '##....', '.####.', '....##', '##..##', '.####.'] },
  t: { top: -2, rows: [...NR(2, '.##..'), '#####', ...NR(5, '.##..'), '####.'] },
};

// ---------- the sampler, laid out in Aida blocks (c = column, r = row; holes at integer corners) ----------
const XS = [];    // cross stitches {c, r, col, key, tag}
const BSEG = [];  // backstitch stitches {a:[hx,hy], b:[hx,hy], col, key, tag}
const HC = [540, 776], RI = 650, RO = 714;     // the hoop: centre, inner and outer radius of the outer ring
const glyphW = (font, ch) => font[ch].rows.reduce((m, r) => Math.max(m, r.length), 0);
let LETTERS = 0;
function xword(font, word, c0, top, col, tag, gap, sp) {
  let c = c0;
  for (const ch of word) {
    if (ch === ' ') { c += sp; continue; }
    const g = font[ch], li = LETTERS++;
    g.rows.forEach((row, ri) => { for (let k = 0; k < row.length; k++) if (row[k] === '#')
      XS.push({ c: c + k, r: top + g.top + ri, col, key: `${tag}:${c + k}:${top + g.top + ri}`, tag, ch, lc: k, lr: ri, li }); });
    c += glyphW(font, ch) + gap;
  }
}
const xwidth = (font, word, gap, sp) => [...word].reduce((w, ch) => w + (ch === ' ' ? sp : glyphW(font, ch) + gap), 0) - gap;
const addBS = (a, b, col, key, tag) => BSEG.push({ a, b, col, key, tag });
function motif(rows, c0, r0, map, tag) {
  rows.forEach((row, ri) => { for (let k = 0; k < row.length; k++) { const col = map[row[k]];
    if (col) XS.push({ c: c0 + k, r: r0 + ri, col, key: `${tag}:${c0 + k}:${r0 + ri}`, tag }); } });
}
const centred = (w, centre) => Math.round(centre - w / 2);
const inHoop = (u, v, m) => { const p = fwd(u, v); return Math.hypot(p[0] - HC[0], p[1] - HC[1]) < RI - m; };

// The motto, centred on four lines in Turkey red.
const MOTTO = (w => [w.slice(0, 2), w.slice(2, 4), [w[4]], [w[5]]].map(l => l.join(' ')))(PHRASE_TO_RENDER.split(' ')), MT = 36, PITCH = 14;
MOTTO.forEach((line, k) => xword(BIG, line, centred(xwidth(BIG, line, 2, 3), 45), MT + k * PITCH, 'turkey', 'w' + k, 2, 3));

// Under it, two birds face each other across a heart.
const MAP = { O: 'ochre', I: 'indigo', S: 'sage', M: 'madder' };
const BIRD = ['........II..', '.......I.IO.', 'I......II...', 'II...IIIII..', '.IIIIISSIII.', '..IIISSSII..', '...IIIIII...', '.....O..O...'];
const HEART = ['.MM..MM.', ...NR(3, 'MMMMMMMM'), '.MMMMMM.', '..MMMM..', '...MM...'];
const BR = 92;
motif(BIRD, 26, BR, MAP, 'birdL');
motif(HEART, 41, BR + 1, MAP, 'heart');
motif(BIRD.map(r => [...r].reverse().join('')), 52, BR, MAP, 'birdR');

// Over it, a strawberry band that runs on under the ring: a vine backstitched hole to hole, a sprig on every crest,
// a berry under every trough. The vine's hole row follows a wave in whole blocks, so each stitch runs straight
// along the grid or diagonally across one block.
const BAND = 22, VY = x => Math.round(1 - Math.cos(2 * Math.PI * x / 16));
const SPRIG = ['..MM..', 'S.MM.S', 'SS..SS', '.S..S.'], BERRY = ['.SSSS.', 'MMMMMM', 'MOMMOM', '.MMMM.', '..MM..'];
const bandCell = (rows, c0, r0, tag) => rows.forEach((row, ri) => { for (let k = 0; k < row.length; k++) {
  const col = MAP[row[k]], c = c0 + k, r = r0 + ri;
  if (col && inHoop(c + 0.5, r + 0.5, -8)) XS.push({ c, r, col, key: `${tag}:${c}:${r}`, tag, mx: c0 + 3 }); } });
for (let x = 45 - 48; x <= 45 + 48; x += 16) {
  bandCell(SPRIG, x - 3, BAND - 4, 'sprig');
  if (inHoop(x, BAND - 2, 10)) addBS([x, BAND], [x, BAND - 2], 'sage', `stem:${x}`, 'stem');
  bandCell(BERRY, x + 5, BAND + 2, 'berry');
}
const VINE = [];
for (let x = -4; x <= 94; x++) if (inHoop(x, BAND + VY(x - 45), -4)) VINE.push([x, BAND + VY(x - 45)]);
// Below the birds a narrow chain of sage crosses closes the panel.
const CHAIN = 104;
for (let c = -4; c < 94; c++) { const k = (((c - 45) % 4) + 4) % 4;
  for (const dr of k === 0 ? [-1, 0, 1] : k === 2 ? [] : [0])
    if (inHoop(c + 0.5, CHAIN + dr + 0.5, -8)) XS.push({ c, r: CHAIN + dr, col: 'sage', key: `chain:${c}:${CHAIN + dr}`, tag: 'chain' }); }
for (let i = 0; i < VINE.length - 1;) {
  const a = VINE[i], b = VINE[i + 1], c = VINE[i + 2];
  if (c && a[1] === b[1] && b[1] === c[1]) { addBS(a, c, 'sage', `vine:${a[0]}`, 'vine'); i += 2; }
  else { addBS(a, b, 'sage', `vine:${a[0]}`, 'vine'); i += 1; }
}

// ---------- the cloth: 14-count Aida, basket-woven blocks of three threads, holes at the corners ----------
const NT = 3;
const HOLE = rgb(62, 49, 39);
let CLOTH = null, LU = null, LV = null, LW = 0;
const HOLEM = new Float32Array(W * H);   // 1 where the cloth parts (holes and channels between blocks)
const LS = 6;
function uvAt(x, y) {   // bilinear lookup of the inverse map
  const gx = x / LS, gy = y / LS, i0 = Math.floor(gx), j0 = Math.floor(gy), fx = gx - i0, fy = gy - j0, k = j0 * LW + i0;
  const a = (1 - fx) * (1 - fy), b = fx * (1 - fy), c = (1 - fx) * fy, d = fx * fy;
  return [LU[k] * a + LU[k + 1] * b + LU[k + LW] * c + LU[k + LW + 1] * d, LV[k] * a + LV[k + 1] * b + LV[k + LW] * c + LV[k + LW + 1] * d];
}
function bakeCloth() {
  LW = Math.ceil(W / LS) + 2; const LH = Math.ceil(H / LS) + 2;
  LU = new Float32Array(LW * LH); LV = new Float32Array(LW * LH);
  for (let j = 0; j < LH; j++) for (let i = 0; i < LW; i++) { const q = inv(i * LS, j * LS); LU[j * LW + i] = q[0]; LV[j * LW + i] = q[1]; }
  const out = new Float32Array(W * H * 3);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const q = uvAt(x + 0.5, y + 0.5), u = q[0], v = q[1];
    const bi = Math.floor(u), bj = Math.floor(v), fu = u - bi, fv = v - bj;
    const vert = ((bi + bj) & 1) === 0;               // which thread group lies on top in this block
    // the block: a rounded square cushion; the thread group squeezes in at its corners, leaving the hole
    const g = 0.008 + 0.014 * ih(bi, bj, 31), rc = 0.2 + 0.1 * ih(bi, bj, 37), hsz = 0.5 - g;
    const ax = Math.abs(fu - 0.5), ay = Math.abs(fv - 0.5), qx = ax - hsz + rc, qy = ay - hsz + rc;
    const sdB = Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - rc;
    const across = vert ? fu : fv, along = vert ? fv : fu, e = Math.min(along, 1 - along), ee = e - g;
    const hwB = ee < rc ? hsz - rc + Math.sqrt(Math.max(0, rc * rc - (rc - Math.max(ee, 0)) ** 2)) : hsz;
    const acr = clamp(0.5 + (across - 0.5) * (hsz / Math.max(hwB, 0.06)), 0, 0.9999);
    const tk = Math.floor(acr * NT), xs = (acr * NT - tk) * 2 - 1;
    const tid = (vert ? bi : bj) * NT + tk, seed = vert ? 101 : 202, gl = vert ? v : u;
    // the thread: tone per thread, slubs along it, the heathered oatmeal blend
    let tone = 0.93 + 0.12 * ih(tid, 0, seed);
    const ft = ih(tid, 1, seed);
    let cr = OAT[0], cg = OAT[1], cb = OAT[2];
    if (ft < 0.06) { cr *= 0.88; cg *= 0.84; cb *= 0.78; } else if (ft > 0.94) tone *= 1.05;
    tone *= 0.93 + 0.14 * vn(gl * 0.8, tid * 1.7, seed + 5);
    if (ih(Math.floor(gl * 4.5), tid, seed + 9) < 0.03) { cr *= 0.6; cg *= 0.52; cb *= 0.44; }
    tone *= 1 + 0.1 * (vn(gl * 16, tid * 2.3 + acr * 3, seed + 13) - 0.5);
    const lane = Math.floor(acr * NT * 3);
    if (ih(Math.floor(gl * 7 + 0.37 * lane), lane + tid * 11, seed + 21) < 0.11) tone *= 0.85;
    // normal: flattened thread cylinders, diving under at the block ends, the cushion rolling off at its edge
    const nl = (along < 0.5 ? -1 : 1) * (1 - sstep(0, 0.32, e)) * 0.85, na = xs * 0.3;
    let nx = vert ? na : nl, ny = vert ? nl : na, nz = Math.sqrt(Math.max(0.04, 1 - na * na));
    const roll = sstep(-0.12, 0, sdB) * 0.55;
    let gx = qx > 0 ? qx : 0, gy = qy > 0 ? qy : 0; if (gx === 0 && gy === 0) { if (qx > qy) gx = 1; else gy = 1; }
    const gn = Math.hypot(gx, gy); nx += Math.sign(fu - 0.5) * gx / gn * roll; ny += Math.sign(fv - 0.5) * gy / gn * roll;
    const nn = Math.hypot(nx, ny, nz); nx /= nn; ny /= nn; nz /= nn;
    const ndl = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
    const ao = (1 - 0.1 * sstep(0.7, 1, Math.abs(xs))) * (0.84 + 0.16 * sstep(0, 0.24, e)) * (1 - 0.06 * sstep(-0.1, 0, sdB));
    const lit = 0.34 + 0.66 * ndl / L[2];
    let r1 = cr * tone * lit * ao, g1 = cg * tone * lit * ao, b1 = cb * tone * lit * ao;
    // outside the cushion: a narrow channel where the threads pass under, widening to a hole at the corner
    const hi = bi + (fu < 0.5 ? 0 : 1), hj = bj + (fv < 0.5 ? 0 : 1);
    const hr0 = 0.13 + 0.06 * ih(hi, hj, 77), cd = Math.hypot(u - hi, v - hj) - hr0 * (0.85 + 0.3 * vn(Math.atan2(v - hj, u - hi) * 1.6, hi + hj * 7, 79));
    const sdH = Math.max(sdB, -cd);
    const inB = sstep(0.035, -0.035, sdH); HOLEM[y * W + x] = 1 - inB;
    if (inB < 1) {
      const hv = 0.75 + 0.5 * vn(x * 0.5, y * 0.5, 91);
      const hol = sstep(-0.01, 0.06, -cd);
      let hr = HOLE[0] * hv, hg = HOLE[1] * hv, hb = HOLE[2] * hv;
      const ch = 0.93 * tone;
      hr = cr * ch * (1 - hol) + hr * hol; hg = cg * ch * (1 - hol) + hg * hol; hb = cb * ch * (1 - hol) + hb * hol;
      // a stray fibre across some holes
      const hz = ih(hi, hj, 53);
      if (hz < 0.45) {
        const th = ih(hi, hj, 57) * Math.PI, o = (ih(hi, hj, 59) - 0.5) * 0.12, dxh = u - hi, dyh = v - hj;
        const dl = Math.abs(dxh * Math.sin(th) - dyh * Math.cos(th) - o), fa = sstep(0.05, 0.015, dl) * 0.7 * hol;
        hr += (cr * 0.8 - hr) * fa; hg += (cg * 0.8 - hg) * fa; hb += (cb * 0.8 - hb) * fa;
      }
      r1 = r1 * inB + hr * (1 - inB); g1 = g1 * inB + hg * (1 - inB); b1 = b1 * inB + hb * (1 - inB);
    }
    const fall = (1.12 - 0.17 * (0.45 * x / W + 0.55 * y / H)) * (1 + 0.025 * (fbm(x / 380, y / 380, 55, 2) - 0.5));
    const k3 = (y * W + x) * 3;
    out[k3] = fall * LIGHT[0] * r1; out[k3 + 1] = fall * LIGHT[1] * g1; out[k3 + 2] = fall * LIGHT[2] * b1;
  }

}
const hole = (hx, hy) => fwd(hx, hy);

// ---------- tubes: strands, floss and needle are lit tubes rasterised per pixel ----------
const IMG = new Float32Array(W * H * 3), SHA = new Float32Array(W * H), TMPB = new Float32Array(W * H);
const SCN = 820 * 820;
const sD = new Float32Array(SCN), sS = new Float32Array(SCN), sX = new Float32Array(SCN), sI = new Int32Array(SCN);
const segTx = new Float32Array(8192), segTy = new Float32Array(8192);
const RB = { x0: 0, y0: 0, w: 0, h: 0, total: 0 };
function raster(pts, ox, oy) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of pts) { x0 = Math.min(x0, p[0] - p[2]); y0 = Math.min(y0, p[1] - p[2]); x1 = Math.max(x1, p[0] + p[2]); y1 = Math.max(y1, p[1] + p[2]); }
  const bx0 = Math.max(0, Math.floor(x0 + ox - 2)), by0 = Math.max(0, Math.floor(y0 + oy - 2));
  const bx1 = Math.min(W - 1, Math.ceil(x1 + ox + 2)), by1 = Math.min(H - 1, Math.ceil(y1 + oy + 2));
  const bw = bx1 - bx0 + 1, bh = by1 - by0 + 1;
  RB.x0 = bx0; RB.y0 = by0; RB.w = Math.max(0, bw); RB.h = Math.max(0, bh); RB.total = 0;
  if (bw <= 0 || bh <= 0) { RB.w = 0; return; }
  if (bw * bh > SCN) throw Error('tube too big ' + bw + 'x' + bh);
  sD.fill(1e9, 0, bw * bh);

  for (let i = 0; i < pts.length - 1; i++) {
    const ax = pts[i][0] + ox, ay = pts[i][1] + oy, bx = pts[i + 1][0] + ox, by = pts[i + 1][1] + oy, ha = pts[i][2], hb = pts[i + 1][2];
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy, len = Math.sqrt(l2);
    if (len < 1e-6) { segTx[i] = segTx[i - 1] || 1; segTy[i] = segTy[i - 1] || 0; continue; }
    segTx[i] = dx / len; segTy[i] = dy / len;
    const hm = Math.max(ha, hb) + 1.5;
    const xa = Math.max(bx0, Math.floor(Math.min(ax, bx) - hm)), xb = Math.min(bx1, Math.ceil(Math.max(ax, bx) + hm));
    const ya = Math.max(by0, Math.floor(Math.min(ay, by) - hm)), yb = Math.min(by1, Math.ceil(Math.max(ay, by) + hm));
    for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) {
      const px = x + 0.5 - ax, py = y + 0.5 - ay;
      let t = (px * dx + py * dy) / l2; t = t < 0 ? 0 : t > 1 ? 1 : t;
      const ex = px - t * dx, ey = py - t * dy, dist = Math.sqrt(ex * ex + ey * ey), hw = ha + (hb - ha) * t;

    }

}
function shadowTube(pts, lift, k) {
  raster(pts, lift * SHX, lift * SHY);
  const { x0, y0, w, h } = RB;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const q = j * w + i, cov = 0.5 - sD[q]; if (cov <= 0) continue;

}
function blur1(src, dst, r, w, h, stride, step) {   // one box pass along rows (step 1) or columns
  const n = 2 * r + 1;
  for (let line = 0; line < h; line++) {
    const base = line * stride; let acc = 0;
    for (let i = -r; i <= r; i++) acc += src[base + clamp(i, 0, w - 1) * step];

// The clamp at twelve o'clock: two beech lugs on the split ends of the outer ring, a brass screw through them,

function brass(nx, ny, nz, k) {

function drawClamp() {
